side="CLIENT"

[[dependencies.${mod_id}]]
modId="jade"
type="optional"
versionRange="*"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="jei"
type="optional"
versionRange="*"
ordering="AFTER"
side="BOTH"
